name: Android CI & Release

# Actions are pinned to immutable commit SHAs rather than tags. A tag can be
# moved to different code by whoever owns the action, and two of the steps here
# run with the repository's write token or near the signing secrets, so what runs
# there has to be exactly what was reviewed.
#
# The module is XAX. Its APK is built from the committed store by the XAX
# compiler named in toolchains.json; no Java toolchain is involved.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  schedule:
    # Weekly, to notice an upstream Syncthing-Fork release that moved something
    # the module hooks before a user does.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the XAX pin
        id: pin
        run: |
          echo "commit=$(jq -r .xax.commit toolchains.json)" >> "$GITHUB_OUTPUT"
          echo "seed=$(jq -r .xax.seeds.linux.path toolchains.json)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(jq -r .xax.seeds.linux.sha256 toolchains.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MrxSiN/XAX
          ref: ${{ steps.pin.outputs.commit }}
          path: xax
          sparse-checkout: ${{ steps.pin.outputs.seed }}
          sparse-checkout-cone-mode: false

      - name: Check the compiler seed
        run: |
          set -eu
          echo "${{ steps.pin.outputs.sha256 }}  xax/${{ steps.pin.outputs.seed }}" | sha256sum -c -
          chmod +x "xax/${{ steps.pin.outputs.seed }}"

      # xcheck is the project's own XAX checker (tools/xcheck); the checklists in checks/ are its input.
      - name: Build xcheck
        run: |
          set -eu
          xaxc="$PWD/xax/${{ steps.pin.outputs.seed }}"
          mkdir -p build
          "$xaxc" verify tools/xcheck/xcheck.xax build/xcheck.rec
          "$xaxc" build tools/xcheck/xcheck.xax build/xcheck build/xcheck.prov
          chmod +x build/xcheck

      - name: Validate project files
        run: |
          git ls-files > build/files.txt
          build/xcheck checks/project.checks

      # Downloads a released Syncthing-Fork APK, so it stays off the pull-request path where a
      # network failure would block an unrelated change.
      - name: Check the supported Syncthing-Fork release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HOST_VERSION: 2.1.5.0
        run: |
          set -eu
          curl -fsSL -o build/host.apk "https://github.com/researchxxl/syncthing-android/releases/download/v$HOST_VERSION/com.github.catfriend1.syncthingfork_release_v$HOST_VERSION.apk"
          unzip -p build/host.apk 'classes*.dex' > build/host.dex
          build/xcheck checks/host-contract.checks

      - name: Build the module
        run: |
          set -eu
          xaxc="$PWD/xax/${{ steps.pin.outputs.seed }}"
          "$xaxc" verify source/xax/syncthingliveupdate.xax build/verify.rec
          "$xaxc" resolve source/xax/syncthingliveupdate.xax build/snapshot.xax source/inputs/*
          "$xaxc" build build/snapshot.xax build/SyncthingLiveUpdate-unsigned.apk build/provenance source/inputs/*

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-apk
          path: |
            build/SyncthingLiveUpdate-unsigned.apk
            build/xcheck

  release:
    name: Sign and publish
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apk
          path: build

      # apksigner is the only thing that ever sees the keystore, and the keystore
      # exists on the runner only for this step.
      - name: Sign the APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          apksigner=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" \
            -name apksigner -type f | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "no apksigner on the runner" >&2; exit 1; }
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore"
          apk="build/SyncthingLiveUpdate-$GITHUB_REF_NAME.apk"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEYSTORE_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" build/SyncthingLiveUpdate-unsigned.apk
          rm -f "$keystore"
          "$apksigner" verify --verbose "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Extract release notes from the changelog
        run: |
          chmod +x build/xcheck
          build/xcheck CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Upload APK to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.APK }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
        env:
          # The workflow's own token, scoped to this repository and to this job
          # alone; no separately maintained personal access token is needed.
          GITHUB_TOKEN: ${{ github.token }}
